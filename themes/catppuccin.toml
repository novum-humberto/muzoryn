schema_version = 1
name = "Catppuccin"

[palette]
base = "#11111B"
panel = "#1E1E2E"
text = "#CDD6F4"
muted = "#9399B2"
border = "#45475A"
cyan = "#89B4FA"
violet = "#CBA6F7"
pink = "#F5C2E7"
amber = "#F9E2AF"
red = "#F38BA8"
green = "#A6E3A1"

[semantic]
"surface.base" = "$base"
"surface.panel" = "$panel"
"text.primary" = "$text"
"text.secondary" = "$muted"
"border.normal" = "$border"
"border.focused" = "$cyan"
"selection.foreground" = "$base"
"selection.background" = "@border.focused"
"playback.active" = "$amber"
"status.error" = "$red"
"status.ok" = "$green"
"progress.elapsed" = "@border.focused"
"accent.secondary" = "$violet"
"accent.tertiary" = "$pink"
