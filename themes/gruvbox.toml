schema_version = 1
name = "Gruvbox"

[palette]
base = "#1D2021"
panel = "#282828"
text = "#EBDBB2"
muted = "#A89984"
border = "#504945"
cyan = "#FABD2F"
violet = "#FE8019"
pink = "#D3869B"
amber = "#B8BB26"
red = "#FB4934"
green = "#B8BB26"

[semantic]
"surface.base" = "$base"
"surface.panel" = "$panel"
"text.primary" = "$text"
"text.secondary" = "$muted"
"border.normal" = "$border"
"border.focused" = "$cyan"
"selection.foreground" = "$base"
"selection.background" = "@border.focused"
"playback.active" = "$amber"
"status.error" = "$red"
"status.ok" = "$green"
"progress.elapsed" = "@border.focused"
"accent.secondary" = "$violet"
"accent.tertiary" = "$pink"
