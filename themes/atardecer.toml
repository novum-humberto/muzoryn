schema_version = 1
name = "Atardecer"

[palette]
base = "#160B10"
panel = "#22121A"
text = "#FFE9DC"
muted = "#C49A8C"
border = "#5A2B35"
cyan = "#FF9E64"
violet = "#FF5D8F"
pink = "#C084FC"
amber = "#FFD166"
red = "#FF4D6D"
green = "#7EE081"

[semantic]
"surface.base" = "$base"
"surface.panel" = "$panel"
"text.primary" = "$text"
"text.secondary" = "$muted"
"border.normal" = "$border"
"border.focused" = "$cyan"
"selection.foreground" = "$base"
"selection.background" = "@border.focused"
"playback.active" = "$amber"
"status.error" = "$red"
"status.ok" = "$green"
"progress.elapsed" = "@border.focused"
"accent.secondary" = "$violet"
"accent.tertiary" = "$pink"
