schema_version = 1
name = "Dracula"

[palette]
base = "#1E1F29"
panel = "#282A36"
text = "#F8F8F2"
muted = "#9EA7D0"
border = "#44475A"
cyan = "#BD93F9"
violet = "#FF79C6"
pink = "#8BE9FD"
amber = "#F1FA8C"
red = "#FF5555"
green = "#50FA7B"

[semantic]
"surface.base" = "$base"
"surface.panel" = "$panel"
"text.primary" = "$text"
"text.secondary" = "$muted"
"border.normal" = "$border"
"border.focused" = "$cyan"
"selection.foreground" = "$base"
"selection.background" = "@border.focused"
"playback.active" = "$amber"
"status.error" = "$red"
"status.ok" = "$green"
"progress.elapsed" = "@border.focused"
"accent.secondary" = "$violet"
"accent.tertiary" = "$pink"
