schema_version = 1
name = "Nord"

[palette]
base = "#242933"
panel = "#2E3440"
text = "#ECEFF4"
muted = "#9DA9C0"
border = "#434C5E"
cyan = "#88C0D0"
violet = "#81A1C1"
pink = "#B48EAD"
amber = "#EBCB8B"
red = "#BF616A"
green = "#A3BE8C"

[semantic]
"surface.base" = "$base"
"surface.panel" = "$panel"
"text.primary" = "$text"
"text.secondary" = "$muted"
"border.normal" = "$border"
"border.focused" = "$cyan"
"selection.foreground" = "$base"
"selection.background" = "@border.focused"
"playback.active" = "$amber"
"status.error" = "$red"
"status.ok" = "$green"
"progress.elapsed" = "@border.focused"
"accent.secondary" = "$violet"
"accent.tertiary" = "$pink"
