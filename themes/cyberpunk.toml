schema_version = 1
name = "Cyberpunk"

[palette]
base = "#0B0414"
panel = "#150826"
text = "#F3E9FF"
muted = "#9C82C4"
border = "#3A1A66"
cyan = "#00F0FF"
violet = "#FF2E97"
pink = "#FCEE0A"
amber = "#FCEE0A"
red = "#FF3860"
green = "#39FF9C"

[semantic]
"surface.base" = "$base"
"surface.panel" = "$panel"
"text.primary" = "$text"
"text.secondary" = "$muted"
"border.normal" = "$border"
"border.focused" = "$cyan"
"selection.foreground" = "$base"
"selection.background" = "@border.focused"
"playback.active" = "$amber"
"status.error" = "$red"
"status.ok" = "$green"
"progress.elapsed" = "@border.focused"
"accent.secondary" = "$violet"
"accent.tertiary" = "$pink"
