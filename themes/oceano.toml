schema_version = 1
name = "Océano"

[palette]
base = "#04121C"
panel = "#071D2B"
text = "#E0F4FF"
muted = "#7FB2CC"
border = "#134560"
cyan = "#2DD4BF"
violet = "#38BDF8"
pink = "#818CF8"
amber = "#FBBF24"
red = "#FB7185"
green = "#34D399"

[semantic]
"surface.base" = "$base"
"surface.panel" = "$panel"
"text.primary" = "$text"
"text.secondary" = "$muted"
"border.normal" = "$border"
"border.focused" = "$cyan"
"selection.foreground" = "$base"
"selection.background" = "@border.focused"
"playback.active" = "$amber"
"status.error" = "$red"
"status.ok" = "$green"
"progress.elapsed" = "@border.focused"
"accent.secondary" = "$violet"
"accent.tertiary" = "$pink"
