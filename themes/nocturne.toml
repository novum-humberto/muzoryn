schema_version = 1
name = "Nocturne"

[palette]
base = "#070B16"
panel = "#0D1426"
text = "#E6EDF7"
muted = "#93A6C4"
border = "#27385A"
cyan = "#27D7F2"
violet = "#8F6BFF"
pink = "#F06BE8"
amber = "#F5B14A"
red = "#FF6B8A"
green = "#3EE08F"

[semantic]
"surface.base" = "$base"
"surface.panel" = "$panel"
"text.primary" = "$text"
"text.secondary" = "$muted"
"border.normal" = "$border"
"border.focused" = "$cyan"
"selection.foreground" = "$base"
"selection.background" = "@border.focused"
"playback.active" = "$amber"
"status.error" = "$red"
"status.ok" = "$green"
"progress.elapsed" = "@border.focused"
"accent.secondary" = "$violet"
"accent.tertiary" = "$pink"
