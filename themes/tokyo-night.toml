schema_version = 1
name = "Tokyo Night"

[palette]
base = "#16161E"
panel = "#1A1B26"
text = "#C0CAF5"
muted = "#7982B4"
border = "#2F334D"
cyan = "#7AA2F7"
violet = "#BB9AF7"
pink = "#F7768E"
amber = "#E0AF68"
red = "#F7768E"
green = "#9ECE6A"

[semantic]
"surface.base" = "$base"
"surface.panel" = "$panel"
"text.primary" = "$text"
"text.secondary" = "$muted"
"border.normal" = "$border"
"border.focused" = "$cyan"
"selection.foreground" = "$base"
"selection.background" = "@border.focused"
"playback.active" = "$amber"
"status.error" = "$red"
"status.ok" = "$green"
"progress.elapsed" = "@border.focused"
"accent.secondary" = "$violet"
"accent.tertiary" = "$pink"
