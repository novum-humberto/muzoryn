[package]
name = "muzoryn"
version = "7.0.1"
edition = "2021"
rust-version = "1.82"
description = "MUZORYN: reproductor musical en terminal (Rust, Ratatui, Rodio)"
license = "MIT"

[dependencies]
ratatui = "=0.29.0"
crossterm = "=0.28.1"
rodio = { version = "=0.21.1", features = ["symphonia-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
lofty = "0.22"
ureq = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc = "=0.2.191"
zbus = { version = "=4.4.0", optional = true }

[features]
default = ["mpris"]
# Control multimedia MPRIS 2 por D-Bus (daemon).
mpris = ["dep:zbus"]

[profile.release]
lto = "thin"
codegen-units = 1

[package.metadata.appimage]
# Ruta a tu archivo .desktop (que ya tienes creado)
desktop_entry = "muzoryn.desktop"

# Ruta a un icono. Puede ser cualquier PNG, incluso uno vacío para probar.
icon = "icon.png"

# Incluye automáticamente las librerías compartidas de las que dependa tu app.
auto_link = true

# Excluye las librerías base que TODO Linux tiene para no engordar el AppImage.
auto_link_exclude_list = [
    "libc.so*",
    "libdl.so*",
    "libpthread.so*",
    "libm.so*",
    "libgcc_s.so*",
    "ld-linux*.so*"
]
