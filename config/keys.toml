# Atajos de MUZORYN. Un atajo propio reemplaza todos los de esa acción.
[keys]
detach = ["w"]
quit_all = ["W", "ctrl+c"]
up = ["up", "k"]
down = ["down", "j"]
seek_forward = ["right"]
seek_backward = ["left"]
focus_next = ["tab"]
play = ["enter"]
toggle = ["space"]
stop = ["s"]
next = ["n"]
previous = ["p"]
enqueue = ["a"]
volume_up = ["=", "+"]
volume_down = ["-"]
reload_theme = ["r"]
cycle_viz = ["b"]
cycle_theme = ["T"]
help = ["?", "f1"]
manual = ["H"]
search = ["/"]
cancel = ["esc"]
delete = ["x", "delete"]
favorite = ["f"]
shuffle = ["z"]
repeat = ["o"]
crossfade = ["c"]
replay_gain = ["g"]
eq_preset = ["e"]
eq_toggle = ["t"]
scan = ["u"]
lyrics_later = ["]"]
lyrics_earlier = ["["]
download = ["d"]
download_all = ["D"]
new_list = ["ctrl+n"]
rename_list = ["f2"]
import_m3u = ["i"]
export_m3u = ["ctrl+e"]
add_to_list = ["l"]
mark = ["m"]
clear_marks = ["M"]
move_up = ["alt+up"]
move_down = ["alt+down"]
clear_queue = ["ctrl+x"]
add_source = ["ctrl+a"]
view_1 = ["1"]
view_2 = ["2"]
view_3 = ["3"]
view_4 = ["4"]
view_5 = ["5"]
view_6 = ["6"]
view_7 = ["7"]
view_8 = ["8"]
view_9 = ["9"]
view_10 = ["0"]
view_11 = ["v"]
view_12 = [","]
